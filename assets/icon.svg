<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- IVAGO Afvalkalender - original icon (not affiliated with IVAGO). CC0 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E7D32"/>
      <stop offset="1" stop-color="#66BB6A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- wheelie bin -->
  <g fill="#FFFFFF">
    <!-- handle -->
    <path d="M214 118 a42 42 0 0 1 84 0 v14 h-24 v-14 a18 18 0 0 0 -36 0 v14 h-24z"/>
    <!-- lid -->
    <rect x="130" y="130" width="252" height="40" rx="14"/>
    <!-- body (stroke-linejoin round gives soft corners) -->
    <polygon points="160,190 352,190 334,408 178,408" stroke="#FFFFFF" stroke-width="20" stroke-linejoin="round"/>
  </g>
  <!-- slots -->
  <g stroke="#2E7D32" stroke-width="16" stroke-linecap="round" fill="none">
    <line x1="222" y1="226" x2="222" y2="366"/>
    <line x1="256" y1="226" x2="256" y2="366"/>
    <line x1="290" y1="226" x2="290" y2="366"/>
  </g>
  <!-- calendar-check badge -->
  <circle cx="392" cy="392" r="80" fill="#FFB300" stroke="#FFFFFF" stroke-width="14"/>
  <path d="M354 394 l28 28 l52 -58" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
